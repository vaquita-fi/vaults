name: Deploy Vaults to Base Networks

on:
  push:
    branches: [ main, deploy ]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'hardhat.config.js'
      - 'package.json'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy to'
        required: true
        default: 'baseSepolia'
        type: choice
        options:
          - baseSepolia
          - base
      token:
        description: 'Token to deploy (USDC, USDT, WETH, cbBTC)'
        required: true
        default: 'USDC'
        type: choice
        options:
          - USDC
          - USDT
          - WETH
          - cbBTC
      verify:
        description: 'Verify contracts on block explorer'
        required: true
        default: true
        type: boolean
      skip_tests:
        description: 'Skip running tests before deployment'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'
  VERIFICATION_DELAY: '15'

jobs:
  # Test job
  test:
    if: ${{ !inputs.skip_tests || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run linting
        run: npm run solhint

      - name: Run tests
        run: npx hardhat test

  # Deploy to Base Sepolia (testnet)
  deploy-base-sepolia:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/deploy') ||
      (github.event_name == 'workflow_dispatch' && inputs.network == 'baseSepolia')
    needs: test
    runs-on: ubuntu-latest
    environment: base-sepolia
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Create environment file
        run: |
          cat > .env << EOF
          PRIVATE_KEY=${{ secrets.PRIVATE_KEY }}
          ETHERSCAN_API_KEY=${{ secrets.ETHERSCAN_API_KEY }}
          VERIFICATION_DELAY=${{ env.VERIFICATION_DELAY }}
          EOF

      - name: Deploy vault to Base Sepolia
        run: |
          ./scripts/deploy-to-base-sepolia.sh --token ${{ inputs.token || 'USDC' }} ${{ (inputs.verify == false || github.event_name == 'push') && '--no-verify' || '' }}

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-sepolia-deployment-logs
          path: |
            artifacts/
            cache/
          retention-days: 30

  # Deploy to Base Mainnet
  deploy-base-mainnet:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.network == 'base')
    needs: test
    runs-on: ubuntu-latest
    environment: base-mainnet
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Create environment file
        run: |
          cat > .env << EOF
          PRIVATE_KEY=${{ secrets.PRIVATE_KEY }}
          ETHERSCAN_API_KEY=${{ secrets.ETHERSCAN_API_KEY }}
          VERIFICATION_DELAY=${{ env.VERIFICATION_DELAY }}
          EOF

      - name: Deploy vault to Base Mainnet
        run: |
          ./scripts/deploy-to-base.sh --token ${{ inputs.token || 'USDC' }} ${{ (inputs.verify == false || github.event_name == 'push') && '--no-verify' || '' }}

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-mainnet-deployment-logs
          path: |
            artifacts/
            cache/
          retention-days: 30


  # Notification job
  notify:
    if: always()
    needs: [test, deploy-base-sepolia, deploy-base-mainnet]
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base Sepolia | ${{ needs.deploy-base-sepolia.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base Mainnet | ${{ needs.deploy-base-mainnet.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Check the deployment logs in the artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Verify contracts on block explorers if verification was enabled" >> $GITHUB_STEP_SUMMARY
          echo "- Test the deployed contracts" >> $GITHUB_STEP_SUMMARY